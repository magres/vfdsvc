name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: cross-build (docker ubuntu:18.04)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build vfdsvc-armv7 (static)
        run: make armv7

      - name: Build vfdsvc-arm64 (static)
        run: make arm64

      - name: Fix dist/ permissions (docker wrote as root)
        run: sudo chmod -R a+rwX dist

      - name: Smoke
        run: |
          file dist/vfdsvc-armv7 dist/vfdsvc-arm64
          test -x dist/vfdsvc-armv7 && test -x dist/vfdsvc-arm64

      - name: Fetch adb tooling (official platform-tools, not stored in git)
        run: |
          mkdir -p tooling/windows tooling/macos tooling/linux
          curl -fsSL -o pt-w.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          curl -fsSL -o pt-m.zip https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
          curl -fsSL -o pt-l.zip https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          unzip -o -q pt-w.zip -d ext-w "platform-tools/adb.exe" "platform-tools/AdbWinApi.dll" "platform-tools/AdbWinUsbApi.dll"
          unzip -o -q pt-m.zip -d ext-m "platform-tools/adb"
          unzip -o -q pt-l.zip -d ext-l "platform-tools/adb"
          cp ext-w/platform-tools/adb.exe ext-w/platform-tools/AdbWinApi.dll ext-w/platform-tools/AdbWinUsbApi.dll tooling/windows/
          cp ext-m/platform-tools/adb tooling/macos/adb
          cp ext-l/platform-tools/adb tooling/linux/adb
          test "$(stat -c %s tooling/linux/adb)" -gt 1000000 || { echo "linux adb is too small"; exit 1; }
          chmod +x tooling/*/adb tooling/*/adb.exe

      - name: Package release zip
        run: bash scripts/package.sh

      - name: Verify release zip contents against the installer
        run: |
          Z=$(ls dist/*.zip | grep -v twrp | head -1)
          rm -rf /tmp/vzip && mkdir -p /tmp/vzip
          unzip -q "$Z" -d /tmp/vzip
          # every payload path the installer .bat pushes must exist in the
          # archive (0.1.8 shipped without scripts/device-check.sh)
          for f in $(grep -oE 'push [^ ]+' scripts/install_windows.bat |
                     sed 's/^push //' | sort -u); do
            case "$f" in %BIN%) continue ;; esac
            f=${f//\\//}   # .bat uses backslashes, the zip uses forward ones
            test -e "/tmp/vzip/$f" || { echo "ZIP-MISSING: $f"; exit 1; }
          done
          test -f /tmp/vzip/scripts/device-check.sh
          echo ZIP-VERIFY-OK

      - name: Package TWRP zips
        run: bash scripts/package-twrp.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vfdsvc-zip
          path: dist/*.zip

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
