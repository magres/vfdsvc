# vfdsvc 0.1.2 — конфигурация Tanix TX92 (Amlogic S912).
# Формат совместим с arthur-liberman/vfd-configurations (linux_openvfd),
# блок vfdsvc-опций ниже — расширение этого формата.
#
# GPIO-пины контроллера дисплея (bank, pin, reserved):
#   bank 0 = основной GPIO-банк (periphs-banks), bank 1 = AO-банк (aobus-banks)
# TX92: CLK=пин76, DAT=пин75, STB=пин53
vfd_gpio_clk='0,76,0'
vfd_gpio_dat='0,75,0'
vfd_gpio_stb='0,53,0'

# Порядок знаков: < D H H M M > (D = позиция иконок/двоеточия)
vfd_chars='4,3,2,1,0'

# Порядок точек-иконок (dot 0..6). На TX92 раскладка 0..6 один к одному.
vfd_dot_bits='0,1,2,3,4,5,6'

# Тип дисплея, reserved, flags, контроллер:
#   layout 1 = T95/TX92-подобные; контроллер 0 = семейство FD628
vfd_display_type='0x01,0x00,0x00,0x00'

# --- опции vfdsvc ---------------------------------------------------------
# Яркость при включённом экране: 1..7
brightness=7
# Что показывать при уходе экрана в сон (standby):
#   dim (по умолчанию) = приглушить до standby_brightness, off = полностью
#   погасить, keep = не менять
standby=dim
# Яркость в приглушённом режиме (standby=dim): 1..7.
#   1 = почти тьма (разница день/ночь драматичная, «как на сток-прошивке»),
#   повышая значение, вы делаете сон ярче (3 примерно «пол-яркости»).
standby_brightness=1
# Как демон знает, что экран ушёл в сон (по убыванию надёжности):
#   1) fb0/blank (если прошивка пишет туда 1..4 при гашении);
#   2) опрос `dumpsys power` раз в awake_poll секунд — на slimBOX это главный
#      сигнал: wake_lock НЕ отражает сон на этой прошивке;
#   3) wake_lock (старый способ, работает на других сборках).
# awake_poll=0 отключает опрос (останется только wake_lock).
awake_poll=2
# Формат времени: auto (следует настройке Android 12/24), либо force 12 / 24
time_format=auto

# Какие иконки отслеживать (через запятую):
#   usb    — вставлена флешка/диск
#   eth    — кабельная сеть поднята (eth0, иначе eth1)
#   wifi   — Wi-Fi поднята (wlan0, иначе wlan1)
#   play   — идёт воспроизведение (видео или звук)
#   pause  — видео на паузе (см. pause_mode)
#   bt     — Bluetooth включён; светится ТОЛЬКО если панель имеет такую метку
#            (у TX92 её нет — просто не загорится; на M9 Pro и подобных есть)
#   alarm  — в системе задан ближайший будильник (Google Clock и т.п.)
icons=usb,eth,wifi,play,pause,bt,alarm

# Датчики для "play" (любой из перечисленных, через запятую):
#   vdec  — аппаратный видеодекодер занят (Amlogic /sys/class/vdec/core,
#           путь переопределяется vdec_file=)
#   pcm   — активен аудиопоток ALSA (осмотр /proc/asound/*/sub0/status)
#   lock  — старый способ: userspace wake-lock с именем *Playback*
#           (проверено на нескольких стоках; на slimBOX не работает)
play_sources=vdec,pcm,lock

# Как решать, что видео "на паузе" (иконка pause):
#   vdec_no_pcm = декодер жив, а звук не идёт
#   off         — иконку pause не показывать
pause_mode=vdec_no_pcm

# Будильник (иконка alarm): горит, пока система знает ближайший будильник.
#   auto     = сначала settings (быстро), затем dumpsys alarm (надёжно)
#   settings = только settings get global next_alarm_formatted
#   dumpsys  = только dumpsys alarm (mNextAlarmClock)
#   off      — не отслеживать
alarm_method=auto
# Период перепроверки будильника (сек), 5..3600
alarm_interval=30

# Bluetooth: rfkill = слушать /sys/class/rfkill (type=bluetooth, state=1);
#   off = не отслеживать
bt_source=rfkill

# Пробовать eth1/wlan1, если eth0/wlan0 нет в системе
net_fallback=on

# Ручная раскладка логических иконок на точки дисплея (dot 0..6).
# Перекрывает таблицу vfd_display_type и vfd_dot_bits. Имена — такие же, как
# в icons=. Пример для бокса, где Bluetooth светится за значком будильника:
#icon_map=alarm=0,usb=1,play=2,pause=3,colon=4,eth=5,wifi=6,bt=0
