# vfdsvc configuration for Tanix TX92 (Amlogic S912).
# Format follows arthur-liberman/vfd-configurations (linux_openvfd).
#
# GPIO pins of the display controller (bank, pin, reserved):
#   bank 0 = main GPIO bank (periphs-banks), bank 1 = AO bank (aobus-banks)
# TX92: CLK=pin76, DAT=pin75, STB=pin53 (periphs)
vfd_gpio_clk='0,76,0'
vfd_gpio_dat='0,75,0'
vfd_gpio_stb='0,53,0'

# Char order: < D H H M M > (D = dots/icons char)
vfd_chars='4,3,2,1,0'

# Icon dots order (see README): 0..6 identity on TX92
vfd_dot_bits='0,1,2,3,4,5,6'

# Display layout type, reserved, flags, controller:
#   layout 1 = T95/TX92-like, controller 0 = FD628 family
vfd_display_type='0x01,0x00,0x00,0x00'

# --- vfdsvc-specific options -------------------------------------------
# Display brightness while screen is on: 1..7
brightness=7
# What the display does when the box screen goes to standby (screen off):
#   dim (default) = lowest brightness, off = display fully off, keep = unchanged
standby=dim
# Time format: auto (default, follows the Android 12/24h setting),
# or force 12 / 24
time_format=auto
# Which status icons to track: usb, eth, wifi, play
icons=usb,eth,wifi,play
